name: tick
on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil /api/tick
        run: |
          curl -sS --fail --retry 3 --retry-delay 5 --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BOT_BASE_URL }}/api/tick"
